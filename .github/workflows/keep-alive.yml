name: Mantener API despierta

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: >-
          curl --fail --silent --show-error --max-time 90
          --retry 3 --retry-delay 10 --retry-all-errors
          https://nexolibro-bknd.onrender.com/api/health
